<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found — ClientFlow CRM</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--color-bg-base);
      padding: 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card" style="max-width: 480px; padding: 2.5rem 2rem; border-radius: var(--radius-2xl);">
    <div style="width: 64px; height: 64px; border-radius: 50%; background-color: #FEF3C7; color: #F59E0B; display: inline-flex; align-items: center; justify-content: center; font-size: 2rem; margin: 0 auto 1.25rem auto;">
      <i class="bi bi-compass"></i>
    </div>
    <div class="mono" style="font-size: 2.5rem; font-weight: 800; color: var(--color-charcoal); line-height: 1;">404</div>
    <h1 class="headline-md" style="margin-top: 0.5rem;">Resource Not Found</h1>
    <p class="body-sm" style="margin: 0.5rem 0 1.5rem 0;">
      The CRM record, dossier, or view you requested is unavailable or may have been archived.
    </p>

    <div class="flex flex-col gap-sm">
      <a href="dashboard.html" class="btn btn-primary btn-lg">
        <i class="bi bi-grid"></i> Return to Dashboard
      </a>
      <a href="contacts.html" class="btn btn-secondary">
        <i class="bi bi-people"></i> Search Contacts
      </a>
    </div>
  </div>

</body>
</html>
